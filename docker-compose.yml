
services:
  postgres:
    image: postgres:17
    container_name: wwf-polit-assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: polit_assistant
      POSTGRES_USER: polit_assistant
      POSTGRES_PASSWORD: polit_assistant_dev
    ports:
      - "5433:5432"
    volumes:
      - polit_assistant_python_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polit_assistant -d polit_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://polit_assistant:polit_assistant_dev@postgres:5432/polit_assistant
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-WWF Polit-Assistant}
      VERIFICATION_BASE_URL: ${VERIFICATION_BASE_URL:-http://localhost:8000}
      TZ: Europe/Zurich
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-u", "-m", "scripts.sync.scheduler"]

volumes:
  polit_assistant_python_postgres_data:
