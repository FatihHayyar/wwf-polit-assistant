
[project]
name = "wwf-polit-assistant"
version = "0.1.0"
description = "Open Data based political monitoring assistant for WWF Switzerland"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "pydantic[email]>=2.7,<3.0",
    "httpx>=0.28,<1.0",
    "APScheduler>=3.10,<4",
    "pwdlib[argon2]>=0.3,<1.0",
    "PyJWT>=2.8,<3.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.15"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
app = ["classification/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["data", "logs", "wipro-submission"]

[tool.ruff.lint]
# Syntax errors, undefined names and unused code (pyflakes).
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Model registry and Alembic revisions import modules for their side effects.
"app/models/__init__.py" = ["F401"]
"migrations/**" = ["F401"]
