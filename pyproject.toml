[project]
name = "wwf-polit-assistant"
version = "0.1.0"
description = "Open Data based political monitoring assistant for WWF Switzerland"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"