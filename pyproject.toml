[project]
name = "wwf-polit-assistant"
version = "0.1.0"
description = "Open Data based political monitoring assistant for WWF Switzerland"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"