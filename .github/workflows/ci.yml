name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Isolated test configuration; no production database or SMTP server.
  DATABASE_URL: sqlite://
  JWT_SECRET_KEY: ci-isolated-test-key-not-used-anywhere-else
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    name: Lint and backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format github .
      - name: Unit and API tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Classification evidence is reproducible
        # The rule-quality comparison needs the full Git history for its baseline.
        run: |
          git fetch --unshallow --quiet || true
          python -m scripts.rule_quality
          python -m scripts.evaluate_holdout
          git diff --exit-code -- docs/05-testing/evidence/

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: for file in app/web/*.js; do node --check "$file"; done
      - name: Translations and module structure
        run: node tests/test_frontend.cjs

  migrations:
    name: Migrations on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install .
      - name: Upgrade, downgrade one step and upgrade again
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check || echo "::warning::Models and migrations differ (see log)."

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag polit-assistant:ci .
      - name: Application imports inside the image
        run: >-
          docker run --rm -e DATABASE_URL=sqlite:// -e JWT_SECRET_KEY=ci-only-secret-key-for-import-check
          polit-assistant:ci python -c "import app.main; print('ok')"
